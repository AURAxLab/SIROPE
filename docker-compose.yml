# ============================================================
# SIROPE — Docker Compose (PostgreSQL)
# ============================================================
# Uso:
#   docker compose up -d         # Arrancar
#   docker compose logs -f       # Ver logs
#   docker compose down          # Parar
#   docker compose down -v       # Parar + borrar datos
# ============================================================

services:
  sirope:
    build: .
    container_name: sirope
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-cambiar-este-secreto-en-produccion}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - SEED_ON_INIT=${SEED_ON_INIT:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:18-alpine
    container_name: sirope-db
    environment:
      POSTGRES_DB: sirope
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d sirope"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
